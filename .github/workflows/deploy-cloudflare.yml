name: Deploy OpenCode Browser

on:
  push:
    branches: [browser-port]
    paths:
      - "packages/app/**"
      - "packages/**/src/**"
      - "packages/**/package.json"
      - "package.json"
      - "bun.lock"
      - "patches/**"
      - ".github/workflows/deploy-cloudflare.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Install Chromium for browser tests
        run: bunx playwright install --with-deps chromium
        working-directory: packages/app
      - name: Typecheck the browser app and E2E suite
        run: |
          bun run typecheck
          bun run typecheck:e2e
        working-directory: packages/app
      - name: Run browser runtime end-to-end test
        run: bun run test:e2e -- browser-port.spec.ts
        working-directory: packages/app
      - run: bun run build
        working-directory: packages/app
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy dist --project-name=opencode-browser --branch=${{ github.ref_name }}
          workingDirectory: packages/app
